name: Build Fivetv APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fivetv APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ar-fivetv
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Spotless
        run: ./gradlew :src:ar:fivetv:spotlessApply

      - name: Compile
        run: ./gradlew :src:ar:fivetv:compileDebugKotlin

      - name: Assemble APK
        run: ./gradlew :src:ar:fivetv:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fivetv-debug-apk
          path: src/ar/fivetv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
